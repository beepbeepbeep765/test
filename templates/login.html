<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACRE CRM — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background: #0d1f40;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    .login-card {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .brand-box {
      border: 1.5px solid #c9a84c;
      padding: 3px 10px;
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: .12em;
      color: #c9a84c;
      display: inline-block;
    }
    .brand-sub {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .18em;
      color: #4a6fa5;
      text-transform: uppercase;
    }
    .btn-signin {
      background: #1e3a6e;
      border: none;
      color: #fff;
      font-weight: 600;
    }
    .btn-signin:hover { background: #2d5299; color: #fff; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="d-flex align-items-center justify-content-center gap-2 mb-1">
        <span class="brand-box">ACRE</span>
        <span class="brand-sub">Solutions <span style="color:#c9a84c;margin-left:4px;">CRM</span></span>
      </div>
      <p class="text-muted small mt-2 mb-0">Internal capital markets platform</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="next" value="{{ next }}" />
      <div class="mb-3">
        <label class="form-label fw-semibold small">Password</label>
        <input type="password" name="password" class="form-control" autofocus
               placeholder="Enter your CRM password" required />
      </div>
      <button type="submit" class="btn btn-signin w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
