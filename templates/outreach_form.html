{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
  <a href="{{ url_for('deal_detail', deal_id=deal.id) }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
  <div>
    <h2 class="fw-bold mb-0">{{ title }}</h2>
    <span class="text-muted small">Deal: {{ deal.name }}</span>
  </div>
</div>

<div class="card border-0 shadow-sm" style="max-width:720px;">
  <div class="card-body p-4">
    <form method="POST">

      <!-- Contact Info -->
      <div class="section-label">Contact Info</div>
      <div class="row g-3 mb-3">
        <div class="col-sm-6">
          <label class="form-label fw-semibold">Contact Name <span class="text-danger">*</span></label>
          <input type="text" name="contact_name" class="form-control" required value="{{ outreach.contact_name if outreach else '' }}" placeholder="Jane Smith" />
        </div>
        <div class="col-sm-6">
          <label class="form-label fw-semibold">Company</label>
          <input type="text" name="company" class="form-control" value="{{ outreach.company if outreach else '' }}" placeholder="Blackstone Real Estate" />
        </div>
        <div class="col-sm-6">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" name="email" class="form-control" value="{{ outreach.email if outreach else '' }}" placeholder="jane@firm.com" />
        </div>
        <div class="col-sm-6">
          <label class="form-label fw-semibold">Sent By</label>
          <input type="text" name="sent_by" class="form-control" value="{{ outreach.sent_by if outreach else '' }}" placeholder="Your name" />
        </div>
      </div>

      <!-- Pipeline Status -->
      <div class="section-label mt-4">Pipeline Status</div>
      <div class="row g-3 mb-3">
        <div class="col-sm-6">
          <label class="form-label fw-semibold">Stage</label>
          <select name="stage" class="form-select">
            {% for s in ['Initial Email', 'OM Sent', 'NDA Signed', 'Call / Meeting', 'Deep Dive / DD', 'Soft Circle', 'Hard Commit', 'Passed'] %}
            <option value="{{ s }}" {% if outreach and outreach.stage == s %}selected{% elif not outreach and s == 'Initial Email' %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-sm-6">
          <label class="form-label fw-semibold">Interest Level</label>
          <select name="interest_level" class="form-select">
            {% for il in ['Unknown', 'Interested', 'Hot', 'Warm', 'Cold', 'Passed', 'No Response'] %}
            <option value="{{ il }}" {% if outreach and outreach.interest_level == il %}selected{% elif not outreach and il == 'Unknown' %}selected{% endif %}>{{ il }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- Our Outreach -->
      <div class="section-label mt-4">Our Outreach</div>
      <div class="row g-3 mb-3">
        <div class="col-sm-4">
          <label class="form-label fw-semibold">Outreach Date</label>
          <input type="date" name="outreach_date" class="form-control" value="{{ outreach.outreach_date if outreach else '' }}" />
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">What We Sent / Said</label>
          <textarea name="outreach_summary" class="form-control" rows="3" placeholder="Brief summary of the email or call…">{{ outreach.outreach_summary if outreach else '' }}</textarea>
        </div>
      </div>

      <!-- Their Response -->
      <div class="section-label mt-4">Their Response</div>
      <div class="row g-3 mb-3">
        <div class="col-sm-4">
          <label class="form-label fw-semibold">Response Date</label>
          <input type="date" name="response_date" class="form-control" value="{{ outreach.response_date if outreach else '' }}" />
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Their Reply / Outcome</label>
          <textarea name="response_summary" class="form-control" rows="3" placeholder="Interested, passed, need more info, requested OM, etc.">{{ outreach.response_summary if outreach else '' }}</textarea>
        </div>
      </div>

      <!-- Follow-Up -->
      <div class="section-label mt-4">Follow-Up</div>
      <div class="row g-3 mb-4">
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="follow_up_needed" id="followup"
                   {% if outreach and outreach.follow_up_needed %}checked{% endif %} />
            <label class="form-check-label fw-semibold" for="followup">Follow-up needed</label>
            <div class="form-text">Highlights this row and shows on the dashboard.</div>
          </div>
        </div>
        <div class="col-sm-4">
          <label class="form-label fw-semibold">Follow-up By</label>
          <input type="date" name="follow_up_date" class="form-control" value="{{ outreach.follow_up_date if outreach else '' }}" />
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('deal_detail', deal_id=deal.id) }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
