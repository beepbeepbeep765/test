<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ACRE CRM{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background:#1a1f2e;">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('index') }}">
      <i class="bi bi-graph-up-arrow text-warning"></i>
      <span class="text-warning fw-bold">ACRE</span><span class="text-white ms-1">CRM</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item">
          <a class="nav-link rounded px-3 {% if request.endpoint == 'index' %}active bg-white bg-opacity-10{% endif %}" href="{{ url_for('index') }}">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded px-3 {% if 'deal' in (request.endpoint or '') %}active bg-white bg-opacity-10{% endif %}" href="{{ url_for('deals') }}">
            <i class="bi bi-building me-1"></i>Deals
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded px-3 {% if 'contact' in (request.endpoint or '') %}active bg-white bg-opacity-10{% endif %}" href="{{ url_for('contacts') }}">
            <i class="bi bi-people me-1"></i>GP Contacts
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded px-3 {% if request.endpoint == 'activity' %}active bg-white bg-opacity-10{% endif %}" href="{{ url_for('activity') }}">
            <i class="bi bi-activity me-1"></i>Activity
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded px-3 {% if 'template' in (request.endpoint or '') %}active bg-white bg-opacity-10{% endif %}" href="{{ url_for('templates') }}">
            <i class="bi bi-envelope-paper me-1"></i>Templates
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid py-4 px-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '<i class="bi bi-check-lg"></i> Copied!';
    btn.classList.add('btn-success'); btn.classList.remove('btn-outline-secondary');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('btn-success'); btn.classList.add('btn-outline-secondary'); }, 2000);
  });
}
</script>
</body>
</html>
