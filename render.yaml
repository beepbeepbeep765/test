databases:
  - name: acre-crm-db
    databaseName: acre_crm
    user: acre_crm
    plan: free

services:
  - type: web
    name: acre-crm
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CRM_PASSWORD
        sync: false   # set this manually in the Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: acre-crm-db
          property: connectionString
